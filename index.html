<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1565c0">
<title>College Hoops Manager</title>
<style>/*
VOICE: game HUD, phone-first, big type, thumb reach
IDEA: a coach's war-room tablet laid over a regional map
PICTURE: the map itself, full bleed, pins and a scout van
COLOUR+TYPE: deep navy chrome, region-tinted land, gold for stars/AP; system font, 15px min
LAYOUT: top bar, map fills, floating HUD, bottom pill, slide-up sheet
*/
:root {
  --navy: #f2f4f7; --navy2: #ffffff; --navy3: #eef2f6; --line: #d7dee7; --ink: #1d2733; --muted: #66758a;
  --gold: #e0a100; --green: #1f9d55; --red: #d93636; --blue: #2f7de1; --violet: #8b63d9;
  --team: #1565c0; --teamsoft: #1565c01f;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; min-width: 0; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--navy); color: var(--ink); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; }
.btn { min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--navy3); font-weight: 600; font-size: 16px; }
.btn.primary { background: var(--gold); color: #ffffff; border-color: #1565c0; }
.btn.dark { background: #e9edf2; border: 1px solid #d7dee7; box-shadow: inset 0 1px 0 #ffffff14; }
.btn.good { background: var(--green); border-color: #1f9d55; color: #ffffff; }
.btn.wide { width: 100%; margin-top: 12px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.round { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #c3ccd6; background: transparent; font-size: 18px; display: grid; place-items: center; }

/* ---------- start ---------- */
.start { height: 100%; overflow: auto; padding: calc(20px + var(--safe-t)) 18px calc(28px + var(--safe-b)); }
.start-inner { max-width: 520px; margin: 0 auto; }
.start h1 { font-size: 32px; margin: 8px 0 4px; }
.lbl { display: block; margin: 20px 0 8px; font-size: 15px; color: var(--muted); font-weight: 600; }
input { width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: var(--navy2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 48px; }
.school-results { margin-top: 6px; border-radius: 12px; overflow: hidden; }
.school-results button { display: flex; justify-content: space-between; width: 100%; text-align: left; padding: 12px 14px; min-height: 48px; background: var(--navy2); border: 0; border-bottom: 1px solid var(--navy); font-size: 16px; }
.school-info { margin-top: 10px; padding: 12px 14px; background: var(--navy2); border-radius: 12px; border: 1px solid var(--gold); font-size: 15px; }
.scouts { display: grid; gap: 10px; }
.scout { text-align: left; padding: 14px; background: var(--navy2); border: 2px solid var(--line); border-radius: 14px; }
.scout.sel { border-color: var(--gold); }
.scout b { font-size: 17px; }
.mini { display: grid; grid-template-columns: 96px 1fr 30px; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); margin-top: 6px; }
.mini .t { height: 8px; border-radius: 4px; background: #e9edf2; overflow: hidden; }
.mini .t i { display: block; height: 100%; background: var(--blue); }
.mini b { color: var(--ink); text-align: right; }

/* ---------- game shell ---------- */
.game { height: 100%; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 12px; padding: calc(8px + var(--safe-t)) 12px 10px; background: linear-gradient(180deg, #0a1524, #142a45); border-bottom: 1px solid #d7dee7; z-index: 5; }
.title { flex: 1; line-height: 1.15; }
.title div:first-child { font-size: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.map-area { position: relative; flex: 1; overflow: hidden; background: radial-gradient(120% 80% at 50% 0%, #e6edf5 0%, #e9edf2 70%); touch-action: none; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }
#map .grid line { stroke: #0000000d; stroke-width: 1; vector-effect: non-scaling-stroke; }
#map path.st { stroke: #e8eef6; stroke-width: 1.2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
#map path.st.sel { stroke: var(--gold); stroke-width: 3; }
#map .intl rect { stroke: #e8eef6; stroke-width: 1.2; vector-effect: non-scaling-stroke; }
#map .intl.sel rect { stroke: var(--gold); stroke-width: 3; }
#map .slbl { fill: #ffffff80; font-weight: 800; text-anchor: middle; pointer-events: none; letter-spacing: .5px; }
#map .route { stroke: var(--gold); stroke-width: 3; stroke-dasharray: 8 7; fill: none; vector-effect: non-scaling-stroke; }
#map .route.home { stroke: #ffffff70; stroke-width: 2; }
.pin, .token, .chip, .homemark, .evmark { transform-box: view-box; }
.pin { cursor: pointer; }
.pin .head { fill: #0f1724; stroke-width: 2.5; }
.pin.s5 .head { stroke: var(--gold); } .pin.s4 .head { stroke: #bcd3ee; } .pin.s3 .head { stroke: #ffffff; } .pin.s2 .head { stroke: #7d8fa3; }
.pin text { fill: #fff; font-weight: 800; font-size: 11px; text-anchor: middle; pointer-events: none; }
.pin.offered .head { fill: #1d5fb8; }
.pin.mine .head { fill: #167a3f; stroke: var(--green); }
.pin.sel .head { fill: #4a3a06; }
.pin .badge { fill: var(--red); stroke: #fff; stroke-width: 1.5; }
.pin .badge-t { font-size: 10px; }
#map .t4, #map .t3, #map .t2 { display: none; }
#map.z4 .t4, #map.z3 .t3, #map.z2 .t2 { display: inline; }
.token circle.bg { fill: #fff; stroke: #e9edf2; stroke-width: 2; }
.token { transition: transform .5s ease; }
.chip rect { fill: #e9edf2; stroke: var(--gold); stroke-width: 1.5; }
.chip text { fill: var(--gold); font-weight: 800; font-size: 13px; text-anchor: middle; }

.ap-card { position: absolute; left: 12px; top: 12px; width: 92px; padding: 8px 6px 8px; text-align: center; background: #ffffffee; border: 1px solid #d7dee7; border-radius: 14px; box-shadow: 0 6px 20px #0003; pointer-events: none; }
.ap-l { font-size: 14px; font-weight: 800; letter-spacing: 1px; color: var(--blue); }
.ap-n { font-size: 40px; font-weight: 800; line-height: 1; margin: 2px 0; }
.ap-max { font-size: 13px; color: var(--muted); }
.ap-card.low .ap-n { color: var(--red); }

.tools { position: absolute; right: 12px; top: 12px; display: grid; gap: 8px; padding: 8px; background: #ffffffee; border: 1px solid #d7dee7; border-radius: 14px; }
.tool { position: relative; width: 52px; height: 48px; border-radius: 10px; border: 1px solid #d7dee7; background: linear-gradient(180deg, #1b3a63, #102640); display: grid; place-items: center; }
.tool svg { width: 26px; height: 26px; fill: #fff; }
.tool.txt { font-size: 13px; font-weight: 700; }
.dot { position: absolute; top: 5px; right: 5px; width: 9px; height: 9px; border-radius: 50%; background: var(--red); }

.event-chip { position: absolute; left: 112px; right: 88px; top: 12px; padding: 8px 12px; border-radius: 12px; background: #fff4d6; border: 1px solid var(--gold); color: var(--gold); font-size: 14px; font-weight: 600; }
.toast { position: absolute; left: 12px; right: 12px; bottom: calc(80px + var(--safe-b)); margin: 0 auto; max-width: 480px; padding: 12px 14px; border-radius: 12px; background: #ffffff; border: 1px solid var(--line); font-size: 15px; box-shadow: 0 8px 24px #0003; }
.toast.ok { border-color: var(--green); } .toast.bad { border-color: var(--red); }

.bottom-bar { position: absolute; left: 0; right: 0; bottom: calc(14px + var(--safe-b)); display: flex; justify-content: center; align-items: center; gap: 10px; padding: 0 12px; pointer-events: none; }
.bottom-bar > * { pointer-events: auto; }
.pill { min-height: 48px; display: flex; align-items: center; padding: 0 18px; border-radius: 24px; background: #ffffff; border: 1px solid #d7dee7; font-size: 16px; font-weight: 700; box-shadow: 0 6px 18px #0003; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bottom-bar .btn { white-space: nowrap; flex: none; border-radius: 24px; min-height: 48px; box-shadow: 0 6px 18px #0003; }

/* ---------- sheet ---------- */
.scrim { position: fixed; inset: 0; background: #0006; z-index: 8; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 560px; height: 88%; z-index: 9; background: var(--navy2); border-radius: 20px 20px 0 0; border-top: 1px solid #d7dee7; box-shadow: 0 -10px 30px #0003; transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1), height .28s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; }
.sheet.half { transform: translateY(0); height: 56%; }
.sheet.full { transform: translateY(0); }
.grab { position: relative; height: 52px; flex: none; display: grid; place-items: center; cursor: grab; touch-action: none; border-bottom: 1px solid #0000000f; }
.grab span { width: 44px; height: 5px; border-radius: 3px; background: #c3ccd6; }
.sheet-x { position: absolute; right: 10px; top: 6px; z-index: 2; width: 40px; height: 40px; border-width: 1px; font-size: 16px; }
.sheet-body { overflow: auto; padding: 0 16px calc(24px + var(--safe-b)); -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.sheet h2 { margin: 12px 0 2px; font-size: 22px; line-height: 1.2; }
.sec { margin: 18px 0 8px; font-size: 14px; font-weight: 700; color: var(--muted); }
.stars { color: var(--gold); letter-spacing: -1px; white-space: nowrap; }
.stars .off { color: #cfd6de; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.fact { background: var(--navy); border-radius: 12px; padding: 10px; text-align: center; }
.fact .k { font-size: 13px; color: var(--muted); }
.fact .v { font-size: 20px; font-weight: 800; }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.acts .btn { font-size: 15px; padding: 0 10px; }
.acts .span2 { grid-column: span 2; }
.note { font-size: 14px; color: var(--muted); margin-top: 6px; }

/* rating rows: Name ....... 72-80/100 + bar */
.rate { padding: 8px 0; border-bottom: 1px solid #0000000f; }
.rate .top { display: flex; justify-content: space-between; font-size: 15px; }
.rate .val { font-weight: 800; font-variant-numeric: tabular-nums; }
.rate .val small { color: var(--muted); font-weight: 500; }
.rate .val.exact { color: var(--green); }
.track { position: relative; height: 12px; margin-top: 6px; border-radius: 6px; background: #e9edf2; overflow: hidden; }
.track .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: linear-gradient(90deg, #2f6fb6, var(--blue)); }
.track .unc { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, #4ea1ff66 0 6px, #4ea1ff2a 6px 12px); border-radius: 0 6px 6px 0; }
.rate.phys .fill { background: linear-gradient(90deg, #6b4bb8, var(--violet)); }
.rate.phys .unc { background: repeating-linear-gradient(135deg, #b48cff66 0 6px, #b48cff2a 6px 12px); }
.rate.pot .fill { background: linear-gradient(90deg, #b8860b, var(--gold)); }
.rate.pot .unc { background: repeating-linear-gradient(135deg, #f5c54266 0 6px, #f5c5422a 6px 12px); }

.trait { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid #0000000f; font-size: 15px; }
.trait b.q { color: #9aa7b6; }
.offer { padding: 8px 0; border-bottom: 1px solid #0000000f; font-size: 15px; }
.offer .row1 { display: flex; justify-content: space-between; }
.ibar { height: 8px; border-radius: 4px; background: #e9edf2; overflow: hidden; margin-top: 5px; }
.ibar i { display: block; height: 100%; background: #9aa7b6; }
.ibar.mine i { background: var(--green); }

.list { display: grid; gap: 8px; }
.card { display: grid; grid-template-columns: 46px 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 10px 12px; min-height: 60px; background: var(--navy); border: 1px solid #e3e8ee; border-radius: 12px; }
.card .pos { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 15px; border: 2.5px solid #fff; background: #0f1724; }
.card .pos.s5 { border-color: var(--gold); } .card .pos.s4 { border-color: #bcd3ee; } .card .pos.s2 { border-color: #7d8fa3; }
.card .nm { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .meta { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .right { text-align: right; font-size: 14px; }
.tag { display: inline-block; font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: #e3e8ee; color: var(--muted); }
.tag.mine { background: #dcf5e6; color: #167a3f; } .tag.off { background: #e0ecfb; color: #1d5fb8; } .tag.lost { background: #fde2e2; color: #b42323; }
.game-row { padding: 12px; background: var(--navy); border: 1px solid #e3e8ee; border-radius: 12px; margin-bottom: 8px; }
.game-row b { font-size: 16px; }
.game-row .who { font-size: 14px; color: var(--muted); margin: 4px 0 10px; }
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 6px; }
.filters button { flex: none; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--navy); font-size: 15px; font-weight: 600; }
.filters button.on { background: var(--gold); color: #ffffff; border-color: var(--gold); }
.news { padding: 10px 0; border-bottom: 1px solid #0000000f; font-size: 15px; }
.news .d { color: var(--muted); font-size: 13px; margin-right: 6px; }
.news.commit { color: #16803f; font-weight: 700; } .news.lost { color: #c22f2f; } .news.rival { color: #9a6b00; } .news.event { color: var(--gold); }
.news.win { color: #1f8a4c; } .news.loss { color: #b84a3e; } .news.travel { color: #6b4bb8; }
.choice { display: grid; gap: 10px; margin-top: 12px; }
.choice .btn { min-height: 56px; text-align: left; padding: 8px 16px; }
.choice .btn small { display: block; font-weight: 500; font-size: 14px; opacity: .8; }
.needs-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #0000000f; font-size: 15px; }

@media (min-width: 700px) {
  .sheet { border-radius: 20px 20px 0 0; }
}
@media (prefers-reduced-motion: reduce) { .sheet, .token { transition: none; } }

/* ---------- manager pages ---------- */
.page { flex: 1; overflow: auto; padding: 14px 14px 24px; -webkit-overflow-scrolling: touch; }
.page.hidden { display: none; }
.page h2 { font-size: 22px; margin: 4px 0 10px; }
.panel { background: var(--navy2); border: 1px solid #e3e8ee; border-radius: 16px; padding: 14px; margin-bottom: 12px; }
.panel .kick { font-size: 14px; color: var(--muted); font-weight: 600; }
.matchup { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin: 10px 0 4px; text-align: center; }
.matchup .abbr { font-size: 30px; font-weight: 800; line-height: 1; }
.matchup .nm { font-size: 14px; color: var(--muted); margin-top: 4px; }
.matchup .ovr { font-size: 14px; margin-top: 4px; }
.matchup .vs { font-size: 15px; color: var(--muted); font-weight: 700; }
.matchup .me .abbr { color: var(--gold); }
.final { text-align: center; font-size: 34px; font-weight: 800; margin: 6px 0; }
.final.w { color: var(--green); } .final.l { color: var(--red); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: #e9edf2; border-radius: 12px; margin: 6px 0 12px; }
.seg button { min-height: 42px; border: 0; border-radius: 9px; background: transparent; font-size: 15px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--navy3); color: var(--ink); box-shadow: inset 0 0 0 1px #d7dee7; }
.seg-l { font-size: 14px; font-weight: 700; color: var(--muted); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.res-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid #0000000f; font-size: 15px; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.res-row .w { color: var(--green); font-weight: 800; } .res-row .l { color: var(--red); font-weight: 800; }
.res-row .gno { color: var(--muted); width: 30px; flex: none; }
.res-row .opp { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res-row.today { background: #1565c014; border-radius: 8px; padding-left: 6px; }
.prow { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid #0000000f; }
.prow .slot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px; background: #e9edf2; color: var(--muted); }
.prow .slot.st { background: var(--gold); color: #ffffff; }
.prow .slot.out { opacity: .4; }
.prow .who { text-align: left; background: none; border: 0; padding: 0; }
.prow .who b { font-size: 16px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .who span { font-size: 14px; color: var(--muted); }
.prow .mv { display: flex; gap: 4px; }
.prow .mv button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--navy3); font-size: 15px; }
.ovr-badge { display: inline-block; min-width: 34px; padding: 2px 6px; border-radius: 8px; background: #e9edf2; font-weight: 800; text-align: center; color: var(--ink); }
.divider { margin: 8px 0; font-size: 13px; color: var(--muted); text-align: center; border-top: 1px dashed #d7dee7; padding-top: 6px; }
.stand { width: 100%; border-collapse: collapse; font-size: 15px; }
.stand th { text-align: left; font-size: 13px; color: var(--muted); font-weight: 600; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.stand td { padding: 9px 4px; border-bottom: 1px solid #0000000f; white-space: nowrap; }
.stand td.n { text-align: right; font-variant-numeric: tabular-nums; }
.stand th.n { text-align: right; }
.stand tr.me td { color: var(--gold); font-weight: 700; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.box { border-collapse: collapse; font-size: 14px; min-width: 640px; }
.box th, .box td { padding: 8px 6px; border-bottom: 1px solid #0000000f; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.box th { color: var(--muted); font-weight: 600; font-size: 13px; }
.box th:first-child, .box td:first-child { text-align: left; position: sticky; left: 0; background: var(--navy2); }
.box tr.tot td { font-weight: 800; border-top: 1px solid var(--line); }
.tabbar { display: grid; grid-template-columns: repeat(5, 1fr); background: #e9edf2; border-top: 1px solid #d7dee7; padding-bottom: var(--safe-b); z-index: 6; }
.tabbar button { position: relative; min-height: 58px; border: 0; background: none; color: var(--muted); font-size: 13px; font-weight: 700; display: grid; place-items: center; gap: 2px; padding: 6px 0; }
.tabbar svg { width: 24px; height: 24px; fill: currentColor; }
.tabbar button.on { color: var(--gold); }
.tabbar .dot { top: 6px; right: calc(50% - 20px); }
.map-area.hidden { display: none; }
.bottom-bar { bottom: 12px; }

/* ---------- live game ---------- */
.live { position: fixed; inset: 0; z-index: 20; background: var(--navy); display: flex; flex-direction: column; padding-top: var(--safe-t); }
.sb { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 14px 16px; background: linear-gradient(180deg, #0a1524, #142a45); border-bottom: 1px solid #d7dee7; text-align: center; }
.sb .t .a { font-size: 18px; font-weight: 800; }
.sb .t .s { font-size: 44px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.sb .t.me .a { color: var(--gold); }
.sb .mid { font-size: 15px; color: var(--muted); font-weight: 700; }
.sb .mid b { display: block; font-size: 22px; color: var(--ink); font-variant-numeric: tabular-nums; }
.live-ctrl { padding: 8px 12px 0; border-bottom: 1px solid #0000000f; }
.live-ctrl .seg { margin: 4px 0 8px; }
.feed { flex: 1; overflow: auto; padding: 4px 14px; }
.ev { display: grid; grid-template-columns: 42px 32px 1fr; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid #0000000c; font-size: 15px; }
.ev .c { color: var(--muted); font-variant-numeric: tabular-nums; }
.ev .tm { display: block; font-weight: 800; font-size: 12px; color: var(--muted); }
.ev.me .tm { color: var(--gold); }
.ev.score { font-weight: 700; }
.ev.me.score .x { color: #1f8a4c; }
.ev.sub .x, .ev.period .x { color: var(--muted); }
.ev.period { text-align: center; }
.live-foot { display: grid; grid-auto-flow: column; gap: 8px; padding: 10px 12px calc(12px + var(--safe-b)); border-top: 1px solid #d7dee7; background: #e9edf2; }
.live-ctrl .seg { margin: 3px 0 6px; padding: 3px; }
.live-ctrl .seg button { min-height: 38px; font-size: 14px; }
/* hidden until scouted / until stars release */
.pin.s0 .head { stroke: #7d8fa3; }
